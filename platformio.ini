; diymore ESP32-S3 Mini, 8 MB QSPI flash + 8 MB Octal PSRAM.
; Use the generic S3 variant: physical GPIO numbers, no assumed Seeed USB IDs.
[env:sonosdial]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DBOARD_HAS_PSRAM
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
